name: Integrate Rio Upstream 2026-10-20
on:
  push:
    branches:
      - merge-upstream-20261020
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: merge-upstream-20261020
          fetch-depth: 0
      - name: Merge official main, resolve both sides
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin sync-upstream-20261020
          git merge --no-commit --no-ff FETCH_HEAD || true
          python3 .github/scripts/resolve-upstream-merge.py
          git add -A
          test -z "$(git diff --cached --name-only --diff-filter=U)"
          git diff --cached --check
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Install Linux font libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev
      - name: Compile Rio frontend
        run: cargo check -p rioterm
      - name: Test terminal escape parsing
        run: cargo test -p rio-vt osc9_9_current_directory
      - name: Test Rio Session V2
        run: cargo test -p rioterm session::tests
      - name: Commit and publish verified merge
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "merge: official Rio main into session-restore integration"
          git push origin HEAD:merge-upstream-20261020
