name: Verify Windows Session Persistence Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.event.pull_request.head.ref == 'session-restore'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: session-restore
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Apply fix
        run: python scripts/fix-session-persistence.py

      - name: Format
        run: cargo fmt --all

      - name: Test persistence on Windows
        run: cargo test -p rioterm session_persistence_tests -- --nocapture

      - name: Test scrollback round trip
        run: cargo test -p rio-vt scrollback_ansi_round_trip

      - name: Compile Rio
        run: cargo check -p rioterm

      - name: Commit verified fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/workflows/fix-session-persistence-pr.yml
          if (Test-Path .github/workflows/fix-session-save-windows.yml) {
            git rm .github/workflows/fix-session-save-windows.yml
          }
          git rm scripts/fix-session-persistence.py
          git add -- frontends/rioterm/src/session/mod.rs frontends/rioterm/src/router/mod.rs frontends/rioterm/src/application.rs rio-backend/src/config/mod.rs .github/workflows/session-restore-windows-release.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(session): persist layouts on fresh Windows installs"
          git push origin HEAD:session-restore
