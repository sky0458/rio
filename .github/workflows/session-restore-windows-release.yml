name: Session Restore Windows Preview

on:
  push:
    branches:
      - session-restore
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-pebrel-cwd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: session-restore
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 .github/scripts/cleanup-pebrel-cwd.py
      - name: Verify formatting
        run: |
          cargo fmt --all -- --check
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "revert: drop duplicate Pebrel cwd inheritance"
          git push origin HEAD:session-restore
