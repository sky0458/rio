name: Session Restore Sync Once

on:
  push:
    branches:
      - session-restore

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout session-restore
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev glslang-tools

      - name: Merge main without touching main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already an ancestor of session-restore"
            exit 0
          fi
          git merge --no-ff -X ours origin/main -m "chore: merge main into session-restore"
          sed -i 's/self\.grid\.style_set\.get(cell\.style_id())/self.grid.style_of(cell)/' rio-vt/src/crosswords/mod.rs
          cargo fmt --all
          cargo check -p rioterm
          git add rio-vt/src/crosswords/mod.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix: adapt session serialization to upstream grid styles"
          fi
          git push origin HEAD:session-restore
