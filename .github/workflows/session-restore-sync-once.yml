name: Session Restore Sync Once

on:
  push:
    branches:
      - session-restore

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout session-restore
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev glslang-tools

      - name: Merge main without touching main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already an ancestor of session-restore"
            exit 0
          fi
          git merge --no-ff -X ours origin/main -m "chore: merge main into session-restore"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("rio-vt/src/crosswords/mod.rs")
          text = path.read_text()
          old = '''                let style = if cell.is_bg_only() {
                    Style {
                        bg: match cell.content_tag() {
                            square::ContentTag::BgRgb => {
                                let (r, g, b) = cell.bg_rgb();
                                AnsiColor::Spec(crate::config::colors::ColorRgb {
                                    r,
                                    g,
                                    b,
                                })
                            }
                            _ => AnsiColor::Indexed(cell.bg_palette_index()),
                        },
                        ..Style::default()
                    }
                } else {
                    self.grid.style_set.get(cell.style_id())
                };
'''
          new = '''                let style = self.grid.style_of(cell);\n'''
          if old not in text:
              raise SystemExit("expected legacy style resolution block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo check -p rioterm
          git add rio-vt/src/crosswords/mod.rs
          git commit -m "fix: adapt session serialization to upstream grid styles"
          git push origin HEAD:session-restore
