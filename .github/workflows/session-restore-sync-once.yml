name: Session Restore Sync Once

on:
  push:
    branches:
      - session-restore

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout session-restore
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose main merge conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already an ancestor of session-restore"
            exit 0
          fi
          set +e
          git merge --no-ff --no-commit origin/main
          rc=$?
          set -e
          echo "merge exit code: $rc"
          git status --short
          echo "UNMERGED FILES:"
          git diff --name-only --diff-filter=U
          if [ "$rc" -ne 0 ]; then
            echo "CONFLICT DIFF:"
            git diff --cc
            exit 1
          fi
          git commit -m "chore: merge main into session-restore"
          git push origin HEAD:session-restore
