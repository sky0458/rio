name: Session Restore Sync Once

on:
  push:
    branches:
      - session-restore

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout session-restore
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev glslang-tools

      - name: Merge main and resolve session deltas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already an ancestor of session-restore"
            exit 0
          fi
          git merge --no-ff --no-commit origin/main || true
          python3 .github/scripts/resolve-session-restore-sync.py
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git add -A
          cargo fmt --all -- --check
          cargo check -p rioterm
          git commit -m "chore: merge main into session-restore and inherit focused cwd"
          git push origin HEAD:session-restore
