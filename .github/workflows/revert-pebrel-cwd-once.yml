name: Revert duplicate Pebrel CWD inheritance once

on:
  push:
    branches:
      - session-restore
    paths:
      - .github/workflows/revert-pebrel-cwd-once.yml

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout session-restore
        uses: actions/checkout@v4
        with:
          ref: session-restore
          fetch-depth: 0

      - name: Remove duplicate Pebrel-derived CWD path
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess
          from pathlib import Path

          PRE = "0fdde0f52fbd43aca42476629e7bb2c7ec4b37a3"

          def old_file(path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{PRE}:{path}"], text=True
              )

          def fn_span(text: str, name: str):
              marker = f"    pub fn {name}("
              start = text.index(marker)
              brace = text.index("{", start)
              depth = 0
              for i in range(brace, len(text)):
                  ch = text[i]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              raise RuntimeError(f"unterminated function {name}")

          def restore_function(path: str, name: str):
              p = Path(path)
              cur = p.read_text()
              old = old_file(path)
              cs, ce = fn_span(cur, name)
              os, oe = fn_span(old, name)
              p.write_text(cur[:cs] + old[os:oe] + cur[ce:])

          context_path = "frontends/rioterm/src/context/mod.rs"
          context = Path(context_path).read_text()
          helper_start = context.index(
              "    /// Resolve the startup directory for a child pane/window from the focused\n"
          )
          helper_end = context.index("    pub fn split(", helper_start)
          Path(context_path).write_text(context[:helper_start] + context[helper_end:])
          restore_function(context_path, "split")
          restore_function(context_path, "add_context")
          restore_function(context_path, "create_new_window")

          event_path = Path("rio-vt/src/event/mod.rs")
          event = event_path.read_text()
          assert event.count("CreateWindow(Option<String>)") == 1
          assert event.count("RioEvent::CreateWindow(_)") == 1
          event = event.replace("CreateWindow(Option<String>)", "CreateWindow")
          event = event.replace("RioEvent::CreateWindow(_)", "RioEvent::CreateWindow")
          event_path.write_text(event)

          app_path = Path("frontends/rioterm/src/application.rs")
          app = app_path.read_text()
          old_arm = '''            RioEventType::Rio(RioEvent::CreateWindow(working_dir)) => {
                let mut config = self.config.clone();
                if let Some(working_dir) = working_dir {
                    config.working_dir = Some(working_dir);
                    #[cfg(not(target_os = "windows"))]
                    {
                        // The fork PTY path has no working-directory parameter.
                        config.use_fork = false;
                    }
                }
                self.router.create_window(
                    event_loop,
                    self.event_proxy.clone(),
                    &config,
                    None,
                    self.app_id.as_deref(),
                );
            }
'''
          new_arm = '''            RioEventType::Rio(RioEvent::CreateWindow) => {
                self.router.create_window(
                    event_loop,
                    self.event_proxy.clone(),
                    &self.config,
                    None,
                    self.app_id.as_deref(),
                );
            }
'''
          assert app.count(old_arm) == 1
          app_path.write_text(app.replace(old_arm, new_arm))

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          new_line = "Windows new-window/new-tab/split CWD inheritance supports Nushell OSC 9;9."
          old_line = "Windows split/new-tab CWD inheritance supports Nushell OSC 9;9."
          assert readme.count(new_line) == 1
          readme_path.write_text(readme.replace(new_line, old_line))

          workflow_path = Path(".github/workflows/session-restore-windows-release.yml")
          workflow = workflow_path.read_text()
          new_bullet = "- Windows current-pane CWD inheritance for new windows, tabs and splits"
          old_bullet = "- Windows current-pane CWD inheritance for new tabs/splits"
          assert workflow.count(new_bullet) == 1
          workflow_path.write_text(workflow.replace(new_bullet, old_bullet))
          PY

          cargo fmt --all -- --check
          git diff --check

      - name: Commit cleanup and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/revert-pebrel-cwd-once.yml
          git add frontends/rioterm/src/context/mod.rs \
                  frontends/rioterm/src/application.rs \
                  rio-vt/src/event/mod.rs \
                  README.md \
                  .github/workflows/session-restore-windows-release.yml
          git commit -m "revert: drop duplicate Pebrel cwd inheritance"
          git push origin HEAD:session-restore
