name: Fix Session Restore Style Tests Once

on:
  push:
    branches:
      - session-restore

permissions:
  contents: write

jobs:
  fix-style-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout session-restore
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix post-merge style access and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('rio-vt/src/crosswords/mod.rs')
          text = p.read_text()
          replacements = {
              'cw.grid.style_set.get(a.style_id())': 'cw.grid.style_of(a)',
              'replayed.grid.style_set.get(b.style_id())': 'replayed.grid.style_of(b)',
              'replayed.grid.style_set.get(bg_cell.style_id()).bg': 'replayed.grid.style_of(&bg_cell).bg',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, got {count}')
              text = text.replace(old, new)
          p.write_text(text)
          PY

          cargo fmt --all -- --check
          cargo test -p rio-vt scrollback_ansi_round_trip

          rm .github/workflows/fix-session-restore-style-tests-once.yml
          git add rio-vt/src/crosswords/mod.rs .github/workflows/fix-session-restore-style-tests-once.yml
          git commit -m "fix: update session scrollback tests for private style API"
          git push origin HEAD:session-restore
